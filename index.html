<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wishlist Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const SUPABASE_URL = "https://tlkzuuovqqdvniytpgni.supabase.co";
const SUPABASE_KEY = "sb_publishable_5KM1-wSwj-00TlvCBJoMDw_iRselgOk";
const TABLE = "wishlist_items";

const PEOPLE = {
  tony: { name: "Tony", role: "adult", accent: "#128C7E", accent2: "#4FD1C5", emoji: "🌻" },
  sarah: { name: "Sarah", role: "adult", accent: "#D6336C", accent2: "#F783AC", emoji: "🌸" },
  amelia: { name: "Amelia", role: "kid", accent: "#7048C4", accent2: "#C7A9FF", emoji: "🦄" },
  noah: { name: "Noah", role: "kid", accent: "#1C7ED6", accent2: "#74C0FC", emoji: "🚀" },
};
// Who each person is allowed to browse & claim from. Empty = can only see their own list.
const VIEW_ACCESS = {
  tony: ["sarah", "amelia", "noah"],
  sarah: ["tony", "amelia", "noah"],
  amelia: [],
  noah: [],
};
const REFRESH_MS = 15000;

const OCCASIONS = [
  { value: "", label: "Any occasion" },
  { value: "birthday", label: "🎂 Birthday" },
  { value: "christmas", label: "🎄 Christmas" },
  { value: "anniversary", label: "💍 Anniversary" },
  { value: "other", label: "✨ Other" },
];
const PRIORITIES = [
  { value: "", label: "No priority set" },
  { value: "low", label: "Low", color: "#17A398" },
  { value: "med", label: "Medium", color: "#F2994A" },
  { value: "high", label: "High", color: "#D6336C" },
];
const PRICE_RANGES = [
  { value: "", label: "No price range" },
  { value: "under_50", label: "Under $50" },
  { value: "50_150", label: "$50 – $150" },
  { value: "150_plus", label: "$150+" },
];
const EMOJI_OPTIONS = [
  "🎁","🎀","🎉","🎊","🕯️","📚","📖","✏️","🎨","🖌️","🎭","🎮","🕹️","🎲","🧩",
  "🎧","🎵","🎸","🥁","🎹","📷","📸","🎬","🍿","☕","🍵","🍫","🍰","🧁","🍕",
  "🍔","👕","👗","👟","👜","💄","💍","👑","🕶️","⌚","📱","💻","🖥️","🖨️","⌨️",
  "🧴","🧼","🌿","🌻","🌸","🌼","🌺","🍀","🌈","☀️","🌙","⭐","✨","💫","🔥",
  "💧","❄️","🏕️","⛺","🚴","🏄","🏂","⚽","🏀","🎾","🏓","🥊","🧘","🚗","✈️",
  "🐶","🐱","🐦","🐠","🦋","🐝","🍄","🌱","🛠️","🧰","🪴","🧸","🎈","🎯","🔮",
];

function priorityMeta(v) {
  return PRIORITIES.find((p) => p.value === v) || null;
}
function occasionLabel(v) {
  const found = OCCASIONS.find((o) => o.value === v);
  return found ? found.label : null;
}
function priceLabel(v) {
  const found = PRICE_RANGES.find((p) => p.value === v);
  return found ? found.label : null;
}

function normalizeLink(raw) {
  const trimmed = (raw || "").trim();
  if (!trimmed) return "";
  if (/^https?:\/\//i.test(trimmed)) return trimmed;
  return "https://" + trimmed;
}

async function supa(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`${res.status} ${res.statusText}${text ? " — " + text : ""}`);
  }
  const text = await res.text();
  if (!text) return null;
  try {
    return JSON.parse(text);
  } catch (e) {
    return null;
  }
}

async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf))
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
}

const EMPTY_FORM = { name: "", link: "", note: "", occasion: "", priority: "", priceRange: "", photoUrl: "", emoji: "🎁" };

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [ready, setReady] = useState(false);
  const [myItems, setMyItems] = useState([]);
  const [theirItems, setTheirItems] = useState([]);
  const [view, setView] = useState("mine"); // "mine" | a PEOPLE key
  const [form, setForm] = useState(EMPTY_FORM);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [pendingUser, setPendingUser] = useState(null);
  const [pinMode, setPinMode] = useState(null);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");
  const [pinChecking, setPinChecking] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(EMPTY_FORM);
  const [filterMine, setFilterMine] = useState("");
  const [filterTheirs, setFilterTheirs] = useState("");
  const [sortTheirs, setSortTheirs] = useState("newest");
  const [pickerOpenFor, setPickerOpenFor] = useState(null);
  const pollRef = useRef(null);

  useEffect(() => {
    setReady(true);
  }, []);

  const SELECT_MINE =
    "id,name,link,note,occasion,priority,price_range,photo_url,emoji,created_at";
  const SELECT_THEIRS =
    "id,name,link,note,occasion,priority,price_range,photo_url,emoji,created_at,claimed_by,purchased";

  const loadMine = useCallback(async (person) => {
    const rows = await supa(
      `${TABLE}?owner=eq.${person}&select=${SELECT_MINE}&order=created_at.desc`
    );
    setMyItems(rows || []);
  }, []);

  const loadTheirs = useCallback(async (person) => {
    const rows = await supa(
      `${TABLE}?owner=eq.${person}&select=${SELECT_THEIRS}&order=created_at.desc`
    );
    setTheirItems(rows || []);
  }, []);

  // Initial load of your own list on login
  useEffect(() => {
    if (!currentUser) return;
    setLoading(true);
    loadMine(currentUser).finally(() => setLoading(false));
  }, [currentUser, loadMine]);

  // Load whichever list is being browsed whenever the tab changes
  useEffect(() => {
    if (!currentUser || view === "mine") return;
    setLoading(true);
    loadTheirs(view).finally(() => setLoading(false));
  }, [view, currentUser, loadTheirs]);

  // Poll: keep the active view(s) fresh
  useEffect(() => {
    if (!currentUser) return;
    pollRef.current = setInterval(() => {
      loadMine(currentUser).catch(() =>
        setError("Couldn't reach the server — check your connection.")
      );
      if (view !== "mine") {
        loadTheirs(view).catch(() =>
          setError("Couldn't reach the server — check your connection.")
        );
      }
    }, REFRESH_MS);
    return () => clearInterval(pollRef.current);
  }, [currentUser, view, loadMine, loadTheirs]);

  async function startPinFlow(person) {
    setPendingUser(person);
    setPinInput("");
    setPinError("");
    setPinChecking(true);
    try {
      const rows = await supa(`wishlist_pins?owner=eq.${person}&select=pin_hash`);
      setPinMode(rows && rows.length > 0 ? "enter" : "set");
    } catch (e) {
      setPinError("Couldn't check PIN status — " + (e && e.message ? e.message : "unknown error"));
      setPendingUser(null);
    } finally {
      setPinChecking(false);
    }
  }

  async function submitPin() {
    const pin = pinInput.trim();
    if (pin.length < 4) {
      setPinError("Use at least 4 digits.");
      return;
    }
    setPinChecking(true);
    setPinError("");
    try {
      const hash = await hashPin(pin);
      if (pinMode === "set") {
        await supa("wishlist_pins", {
          method: "POST",
          headers: { Prefer: "return=minimal" },
          body: JSON.stringify({ owner: pendingUser, pin_hash: hash }),
        });
        setCurrentUser(pendingUser);
        setPendingUser(null);
        setPinMode(null);
      } else {
        const rows = await supa(`wishlist_pins?owner=eq.${pendingUser}&select=pin_hash`);
        const stored = rows && rows[0] && rows[0].pin_hash;
        if (stored === hash) {
          setCurrentUser(pendingUser);
          setPendingUser(null);
          setPinMode(null);
        } else {
          setPinError("Wrong PIN — try again.");
        }
      }
    } catch (e) {
      setPinError("Something went wrong — " + (e && e.message ? e.message : "unknown error"));
    } finally {
      setPinChecking(false);
    }
  }

  function cancelPin() {
    setPendingUser(null);
    setPinMode(null);
    setPinInput("");
    setPinError("");
  }

  function switchUser() {
    setCurrentUser(null);
    setView("mine");
    setMyItems([]);
    setTheirItems([]);
    setEditingId(null);
    setFilterMine("");
    setFilterTheirs("");
  }

  async function addItem() {
    if (submitting) return;
    setError("");
    if (!form.name.trim()) {
      setError("Give it a name before adding it to your list.");
      return;
    }
    const payload = {
      owner: currentUser,
      name: form.name.trim(),
      link: normalizeLink(form.link),
      note: form.note.trim(),
      occasion: form.occasion || null,
      priority: form.priority || null,
      price_range: form.priceRange || null,
      photo_url: normalizeLink(form.photoUrl),
      emoji: form.emoji || "🎁",
    };
    setSubmitting(true);
    try {
      await supa(TABLE, {
        method: "POST",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify(payload),
      });
      setForm(EMPTY_FORM);
      setPickerOpenFor(null);
      await loadMine(currentUser);
    } catch (e) {
      setError("Couldn't save that — " + (e && e.message ? e.message : "unknown error"));
    } finally {
      setSubmitting(false);
    }
  }

  function startEdit(item) {
    setEditingId(item.id);
    setPickerOpenFor(null);
    setEditForm({
      name: item.name || "",
      link: item.link || "",
      note: item.note || "",
      occasion: item.occasion || "",
      priority: item.priority || "",
      priceRange: item.price_range || "",
      photoUrl: item.photo_url || "",
      emoji: item.emoji || "🎁",
    });
  }

  function cancelEdit() {
    setEditingId(null);
    setEditForm(EMPTY_FORM);
    setPickerOpenFor(null);
  }

  async function saveEdit(id) {
    if (!editForm.name.trim()) {
      setError("Give it a name before saving.");
      return;
    }
    const payload = {
      name: editForm.name.trim(),
      link: normalizeLink(editForm.link),
      note: editForm.note.trim(),
      occasion: editForm.occasion || null,
      priority: editForm.priority || null,
      price_range: editForm.priceRange || null,
      photo_url: normalizeLink(editForm.photoUrl),
      emoji: editForm.emoji || "🎁",
    };
    try {
      await supa(`${TABLE}?id=eq.${id}`, {
        method: "PATCH",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify(payload),
      });
      setMyItems((prev) => prev.map((i) => (i.id === id ? { ...i, ...payload } : i)));
      setEditingId(null);
      setEditForm(EMPTY_FORM);
      setPickerOpenFor(null);
    } catch (e) {
      setError("Couldn't save your changes — " + (e && e.message ? e.message : "unknown error"));
    }
  }

  async function removeItemRow(id) {
    try {
      await supa(`${TABLE}?id=eq.${id}`, { method: "DELETE" });
      setMyItems((prev) => prev.filter((i) => i.id !== id));
    } catch (e) {
      setError("Couldn't remove that — " + (e && e.message ? e.message : "unknown error"));
    }
  }

  function receivedItem(id) {
    removeItemRow(id);
  }

  function deleteItem(id) {
    if (window.confirm("Remove this item from your list? This can't be undone.")) {
      removeItemRow(id);
    }
  }

  async function toggleClaim(item) {
    const isMine = item.claimed_by === currentUser;
    const patch = isMine
      ? { claimed_by: null, claimed_at: null, purchased: false, purchased_at: null }
      : { claimed_by: currentUser, claimed_at: new Date().toISOString() };
    setTheirItems((prev) =>
      prev.map((i) =>
        i.id === item.id
          ? { ...i, claimed_by: patch.claimed_by, purchased: isMine ? false : i.purchased }
          : i
      )
    );
    try {
      await supa(`${TABLE}?id=eq.${item.id}`, {
        method: "PATCH",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify(patch),
      });
    } catch (e) {
      setError("Couldn't save that change — " + (e && e.message ? e.message : "unknown error"));
      loadTheirs(view);
    }
  }

  async function togglePurchased(item) {
    const patch = item.purchased
      ? { purchased: false, purchased_at: null }
      : { purchased: true, purchased_at: new Date().toISOString() };
    setTheirItems((prev) =>
      prev.map((i) => (i.id === item.id ? { ...i, purchased: patch.purchased } : i))
    );
    try {
      await supa(`${TABLE}?id=eq.${item.id}`, {
        method: "PATCH",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify(patch),
      });
    } catch (e) {
      setError("Couldn't save that change — " + (e && e.message ? e.message : "unknown error"));
      loadTheirs(view);
    }
  }

  function renderEmojiPicker(current, onPick, context) {
    const isOpen = pickerOpenFor === context;
    return (
      <div>
        <button
          type="button"
          onClick={() => setPickerOpenFor(isOpen ? null : context)}
          style={styles.emojiToggle}
        >
          <span style={{ fontSize: 22 }}>{current || "🎁"}</span>
          <span style={{ fontSize: 12, color: "#8A7A5C" }}>{isOpen ? "close" : "choose icon"}</span>
        </button>
        {isOpen && (
          <div style={styles.emojiGrid}>
            {EMOJI_OPTIONS.map((em) => (
              <button
                type="button"
                key={em}
                onClick={() => {
                  onPick(em);
                  setPickerOpenFor(null);
                }}
                style={{
                  ...styles.emojiOption,
                  ...(em === current ? styles.emojiOptionSelected : {}),
                }}
              >
                {em}
              </button>
            ))}
          </div>
        )}
      </div>
    );
  }

  if (!ready) {
    return (
      <div style={styles.root}>
        </div>
    );
  }

  if (!currentUser && pendingUser) {
    const p = PEOPLE[pendingUser];
    return (
      <div style={styles.root}>
        <div style={styles.pickWrap}>
          <span style={{ fontSize: 40 }}>{p.emoji}</span>
          <h1 style={{ ...styles.pickTitle, color: p.accent }}>
            {pinChecking && !pinMode
              ? "One sec…"
              : pinMode === "set"
              ? `Set a PIN for ${p.name}`
              : `Enter ${p.name}'s PIN`}
          </h1>
          {pinMode === "set" && (
            <p style={styles.pickHint}>
              First time here — pick a PIN (4+ digits) you'll use to get into your own list from now on.
            </p>
          )}
          {pinMode && (
            <>
              <input
                style={{ ...styles.input, textAlign: "center", fontSize: 20, letterSpacing: 4, marginBottom: 12 }}
                type="password"
                inputMode="numeric"
                pattern="[0-9]*"
                placeholder="••••"
                value={pinInput}
                onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ""))}
                onKeyDown={(e) => e.key === "Enter" && submitPin()}
                autoFocus
              />
              {pinError && <p style={styles.errorText}>⚠️ {pinError}</p>}
              <button
                type="button"
                onClick={submitPin}
                disabled={pinChecking}
                style={{
                  ...styles.addBtn,
                  background: `linear-gradient(135deg, ${p.accent}, ${p.accent2})`,
                  width: "100%",
                  opacity: pinChecking ? 0.6 : 1,
                }}
              >
                {pinChecking ? "✨ checking…" : pinMode === "set" ? "Set PIN & continue" : "Continue"}
              </button>
              <button type="button" onClick={cancelPin} style={{ ...styles.switchBtn, marginTop: 14 }}>
                ← back
              </button>
            </>
          )}
        </div>
      </div>
    );
  }

  if (!currentUser) {
    return (
      <div style={styles.root}>
        <div style={styles.pickWrap}>
          <p style={styles.groovyRow}>☮️ 🌈 ✌️</p>
          <p style={styles.eyebrow}>wishlist keeper</p>
          <h1 style={styles.pickTitle}>Who's checking in, groovy one?</h1>
          <div style={styles.pickGrid}>
            {Object.keys(PEOPLE).map((p) => (
              <button
                key={p}
                onClick={() => startPinFlow(p)}
                style={{
                  ...styles.pickTile,
                  borderColor: PEOPLE[p].accent,
                  background: `linear-gradient(160deg, #fff 60%, ${PEOPLE[p].accent2}33)`,
                }}
              >
                <span style={styles.pickEmoji}>{PEOPLE[p].emoji}</span>
                <span style={{ ...styles.pickName, color: PEOPLE[p].accent }}>
                  {PEOPLE[p].name}
                </span>
              </button>
            ))}
          </div>
          <p style={styles.pickHint}>
            🤫 Your own list stays private to you until it's given. What you pick from
            someone else's list stays private from them.
          </p>
        </div>
      </div>
    );
  }

  const me = PEOPLE[currentUser];
  const viewableList = VIEW_ACCESS[currentUser] || [];
  const partner = view !== "mine" ? PEOPLE[view] : null;

  const mineOccasions = Array.from(new Set(myItems.map((i) => i.occasion).filter(Boolean)));
  const theirsOccasions = Array.from(new Set(theirItems.map((i) => i.occasion).filter(Boolean)));

  let mineList = filterMine ? myItems.filter((i) => i.occasion === filterMine) : myItems;
  let theirsList = filterTheirs ? theirItems.filter((i) => i.occasion === filterTheirs) : theirItems;
  if (sortTheirs === "priority") {
    const rank = { high: 0, med: 1, low: 2, "": 3, null: 3 };
    theirsList = [...theirsList].sort((a, b) => (rank[a.priority || ""] ?? 3) - (rank[b.priority || ""] ?? 3));
  }

  function renderBadges(item) {
    const pm = priorityMeta(item.priority);
    const oc = occasionLabel(item.occasion);
    const pr = priceLabel(item.price_range);
    if (!pm && !oc && !pr) return null;
    return (
      <div style={styles.badgeRow}>
        {oc && <span style={styles.badge}>{oc}</span>}
        {pm && (
          <span style={{ ...styles.badge, background: pm.color + "22", color: pm.color, fontWeight: 700 }}>
            {pm.label} priority
          </span>
        )}
        {pr && <span style={styles.badge}>{pr}</span>}
      </div>
    );
  }

  function renderFilterChips(occasions, activeFilter, setFilter) {
    if (occasions.length === 0) return null;
    return (
      <div style={styles.chipRow}>
        <button
          onClick={() => setFilter("")}
          style={{ ...styles.chip, ...(activeFilter === "" ? styles.chipActive : {}) }}
        >
          All
        </button>
        {occasions.map((o) => (
          <button
            key={o}
            onClick={() => setFilter(o)}
            style={{ ...styles.chip, ...(activeFilter === o ? styles.chipActive : {}) }}
          >
            {occasionLabel(o) || o}
          </button>
        ))}
      </div>
    );
  }

  return (
    <div style={styles.root}>
      <div style={styles.app}>
        <header style={styles.header}>
          <div>
            <p style={styles.eyebrow}>{me.emoji} wishlist keeper</p>
            <h1 style={{ ...styles.name, color: me.accent }}>{me.name}</h1>
          </div>
          <button onClick={switchUser} style={styles.switchBtn}>
            🔄 switch
          </button>
        </header>

        {viewableList.length > 0 && (
          <nav style={styles.tabs}>
            <button
              onClick={() => setView("mine")}
              style={{
                ...styles.tab,
                ...(view === "mine" ? { ...styles.tabActive, background: me.accent, color: "#fff" } : {}),
              }}
            >
              🎁 My list
            </button>
            {viewableList.map((key) => (
              <button
                key={key}
                onClick={() => setView(key)}
                style={{
                  ...styles.tab,
                  ...(view === key
                    ? { ...styles.tabActive, background: PEOPLE[key].accent, color: "#fff" }
                    : {}),
                }}
              >
                {PEOPLE[key].emoji} {PEOPLE[key].name}
              </button>
            ))}
          </nav>
        )}

        {error && <p style={styles.errorText}>⚠️ {error}</p>}
        {loading && <p style={styles.emptyText}>✨ loading the good vibes…</p>}

        {!loading && view === "mine" && (
          <section>
            <div style={{ ...styles.form, borderColor: me.accent2 }}>
              <p style={styles.formLabel}>✨ Add something you'd like</p>
              {renderEmojiPicker(form.emoji, (em) => setForm((f) => ({ ...f, emoji: em })), "add")}
              <input
                style={styles.input}
                placeholder="What is it?"
                value={form.name}
                onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))}
              />
              <input
                style={styles.input}
                placeholder="🔗 Link (optional)"
                value={form.link}
                onChange={(e) => setForm((f) => ({ ...f, link: e.target.value }))}
              />
              <input
                style={styles.input}
                placeholder="📸 Photo URL (optional)"
                value={form.photoUrl}
                onChange={(e) => setForm((f) => ({ ...f, photoUrl: e.target.value }))}
              />
              <input
                style={styles.input}
                placeholder="📝 Size, colour, anything to note (optional)"
                value={form.note}
                onChange={(e) => setForm((f) => ({ ...f, note: e.target.value }))}
              />
              <div style={styles.selectRow}>
                <select
                  style={styles.select}
                  value={form.occasion}
                  onChange={(e) => setForm((f) => ({ ...f, occasion: e.target.value }))}
                >
                  {OCCASIONS.map((o) => (
                    <option key={o.value} value={o.value}>{o.label}</option>
                  ))}
                </select>
                <select
                  style={styles.select}
                  value={form.priority}
                  onChange={(e) => setForm((f) => ({ ...f, priority: e.target.value }))}
                >
                  {PRIORITIES.map((p) => (
                    <option key={p.value} value={p.value}>{p.label}</option>
                  ))}
                </select>
              </div>
              <select
                style={styles.select}
                value={form.priceRange}
                onChange={(e) => setForm((f) => ({ ...f, priceRange: e.target.value }))}
              >
                {PRICE_RANGES.map((p) => (
                  <option key={p.value} value={p.value}>{p.label}</option>
                ))}
              </select>
              <button
                type="button"
                onClick={addItem}
                disabled={submitting}
                style={{
                  ...styles.addBtn,
                  background: `linear-gradient(135deg, ${me.accent}, ${me.accent2})`,
                  opacity: submitting ? 0.6 : 1,
                  cursor: submitting ? "not-allowed" : "pointer",
                }}
              >
                {submitting ? "✨ adding…" : "➕ Add to list"}
              </button>
            </div>

            {me.role === "kid" && (
              <p style={styles.pickHint}>🎁 Dad and Sarah can peek at this list to plan surprises for you!</p>
            )}

            {renderFilterChips(mineOccasions, filterMine, setFilterMine)}

            {mineList.length === 0 ? (
              <p style={styles.emptyText}>
                🌼 Nothing here yet — add the first thing you're hoping for.
              </p>
            ) : (
              mineList.map((item) =>
                editingId === item.id ? (
                  <div key={item.id} style={{ ...styles.form, borderColor: me.accent2, marginBottom: 12 }}>
                    <p style={styles.formLabel}>✏️ Editing</p>
                    {renderEmojiPicker(editForm.emoji, (em) => setEditForm((f) => ({ ...f, emoji: em })), "edit")}
                    <input
                      style={styles.input}
                      placeholder="What is it?"
                      value={editForm.name}
                      onChange={(e) => setEditForm((f) => ({ ...f, name: e.target.value }))}
                    />
                    <input
                      style={styles.input}
                      placeholder="🔗 Link (optional)"
                      value={editForm.link}
                      onChange={(e) => setEditForm((f) => ({ ...f, link: e.target.value }))}
                    />
                    <input
                      style={styles.input}
                      placeholder="📸 Photo URL (optional)"
                      value={editForm.photoUrl}
                      onChange={(e) => setEditForm((f) => ({ ...f, photoUrl: e.target.value }))}
                    />
                    <input
                      style={styles.input}
                      placeholder="📝 Note (optional)"
                      value={editForm.note}
                      onChange={(e) => setEditForm((f) => ({ ...f, note: e.target.value }))}
                    />
                    <div style={styles.selectRow}>
                      <select
                        style={styles.select}
                        value={editForm.occasion}
                        onChange={(e) => setEditForm((f) => ({ ...f, occasion: e.target.value }))}
                      >
                        {OCCASIONS.map((o) => (
                          <option key={o.value} value={o.value}>{o.label}</option>
                        ))}
                      </select>
                      <select
                        style={styles.select}
                        value={editForm.priority}
                        onChange={(e) => setEditForm((f) => ({ ...f, priority: e.target.value }))}
                      >
                        {PRIORITIES.map((p) => (
                          <option key={p.value} value={p.value}>{p.label}</option>
                        ))}
                      </select>
                    </div>
                    <select
                      style={styles.select}
                      value={editForm.priceRange}
                      onChange={(e) => setEditForm((f) => ({ ...f, priceRange: e.target.value }))}
                    >
                      {PRICE_RANGES.map((p) => (
                        <option key={p.value} value={p.value}>{p.label}</option>
                      ))}
                    </select>
                    <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
                      <button
                        type="button"
                        onClick={() => saveEdit(item.id)}
                        style={{ ...styles.addBtn, flex: 1, background: `linear-gradient(135deg, ${me.accent}, ${me.accent2})` }}
                      >
                        💾 Save
                      </button>
                      <button type="button" onClick={cancelEdit} style={{ ...styles.removeBtn, flex: 1 }}>
                        Cancel
                      </button>
                    </div>
                  </div>
                ) : (
                  <div key={item.id} style={{ ...styles.row, borderLeftColor: me.accent }}>
                    {item.photo_url && (
                      <img src={item.photo_url} alt="" style={styles.thumb} onError={(e) => (e.target.style.display = "none")} />
                    )}
                    <div style={styles.rowMain}>
                      <p style={styles.itemName}>{item.emoji || "🎁"} {item.name}</p>
                      {renderBadges(item)}
                      {item.link && (
                        <a href={item.link} target="_blank" rel="noreferrer" style={{ ...styles.itemLink, color: me.accent }}>
                          🔗 view link
                        </a>
                      )}
                      {item.note && <p style={styles.itemNote}>📝 {item.note}</p>}
                    </div>
                    <div style={styles.rowActions}>
                      <button onClick={() => startEdit(item)} style={styles.iconBtn} title="Edit">
                        ✏️
                      </button>
                      <button onClick={() => receivedItem(item.id)} style={styles.removeBtn} title="Remove once you've received it">
                        📦 received
                      </button>
                      <button onClick={() => deleteItem(item.id)} style={styles.iconBtn} title="Delete — changed your mind">
                        🗑️
                      </button>
                    </div>
                  </div>
                )
              )
            )}
          </section>
        )}

        {!loading && view !== "mine" && partner && (
          <section>
            {renderFilterChips(theirsOccasions, filterTheirs, setFilterTheirs)}
            {theirItems.some((i) => i.priority) && (
              <div style={styles.chipRow}>
                <button
                  onClick={() => setSortTheirs("newest")}
                  style={{ ...styles.chip, ...(sortTheirs === "newest" ? styles.chipActive : {}) }}
                >
                  🕓 Newest
                </button>
                <button
                  onClick={() => setSortTheirs("priority")}
                  style={{ ...styles.chip, ...(sortTheirs === "priority" ? styles.chipActive : {}) }}
                >
                  🔥 Priority
                </button>
              </div>
            )}
            {theirsList.length === 0 ? (
              <p style={styles.emptyText}>🌼 {partner.name} hasn't added anything yet.</p>
            ) : (
              theirsList.map((item) => {
                const claimedByMe = item.claimed_by === currentUser;
                const claimedBySomeoneElse = item.claimed_by && item.claimed_by !== currentUser;
                return (
                  <div key={item.id} style={{ ...styles.row, borderLeftColor: partner.accent }}>
                    {item.photo_url && (
                      <img src={item.photo_url} alt="" style={styles.thumb} onError={(e) => (e.target.style.display = "none")} />
                    )}
                    <div style={styles.rowMain}>
                      <p style={styles.itemName}>{item.emoji || "🎁"} {item.name}</p>
                      {renderBadges(item)}
                      {item.link && (
                        <a href={item.link} target="_blank" rel="noreferrer" style={{ ...styles.itemLink, color: partner.accent }}>
                          🔗 view link
                        </a>
                      )}
                      {item.note && <p style={styles.itemNote}>📝 {item.note}</p>}
                    </div>
                    <div style={styles.rowActions}>
                      <button
                        onClick={() => toggleClaim(item)}
                        disabled={claimedBySomeoneElse}
                        style={{
                          ...styles.claimBtn,
                          ...(claimedByMe
                            ? { background: `linear-gradient(135deg, ${partner.accent}, ${partner.accent2})`, color: "#fff", borderColor: partner.accent }
                            : {}),
                          ...(claimedBySomeoneElse ? styles.claimBtnDisabled : {}),
                        }}
                      >
                        {claimedByMe ? "✅ you've got this" : claimedBySomeoneElse ? "🙅 spoken for" : "🎁 I'll get this"}
                      </button>
                      {claimedByMe && (
                        <button
                          onClick={() => togglePurchased(item)}
                          style={{
                            ...styles.claimBtn,
                            ...(item.purchased
                              ? { background: "#3A2E1F", color: "#fff", borderColor: "#3A2E1F" }
                              : {}),
                          }}
                        >
                          {item.purchased ? "🛍️ purchased" : "mark purchased"}
                        </button>
                      )}
                    </div>
                  </div>
                );
              })
            )}
            <p style={styles.pickHint}>
              🤫 {partner.name} can't see what's claimed or purchased — pick freely.
            </p>
          </section>
        )}
      </div>
    </div>
  );
}
